pack_version: "0.1.0"
topic:
  slug: "go-basics"
  name: "Go Basics"
questions:
  - type: "single_select"
    intro: "Consider Go's control flow mechanisms."
    prompt: "What does `defer` do in Go?"
    choices:
      - { id: "1", text: "Executes the function call immediately" }
      - { id: "2", text: "Schedules the call to run when the surrounding function returns" }
      - { id: "3", text: "Pauses the current goroutine" }
    correct_choice_ids: ["2"]
    tags: ["functions", "control-flow"]
    difficulty: easy

  - type: "multi_select"
    prompt: "Which of these are valid Go data types?"
    choices:
      - { id: "1", text: "int" }
      - { id: "2", text: "float64" }
      - { id: "3", text: "char" }
      - { id: "4", text: "string" }
    correct_choice_ids: ["1", "2", "4"]
    tags: ["types"]
    difficulty: easy

  - type: "single_select"
    prompt: "What is the zero value of a `bool` in Go?"
    choices:
      - { id: "1", text: "true" }
      - { id: "2", text: "false" }
      - { id: "3", text: "nil" }
    correct_choice_ids: ["2"]
    tags: ["types", "zero-values"]
    difficulty: easy
