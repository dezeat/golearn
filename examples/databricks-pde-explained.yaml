pack_version: "0.1.0"
topic:
  slug: "databricks-pde-explained"
  name: "Databricks PDE — Explained Practice"
questions:
  # ── 1. Auto Loader: Schema Inference & Evolution ─────────────

  - type: "single_select"
    intro: "Auto Loader incrementally ingests new data files from cloud storage into Delta Lake tables using Structured Streaming."
    prompt: "When using Auto Loader with cloudFiles format, which option must be set to a persistent path so that Auto Loader can track and evolve the inferred schema across stream restarts?"
    choices:
      - { id: "A", text: "cloudFiles.schemaLocation" }
      - { id: "B", text: "cloudFiles.inferColumnTypes" }
      - { id: "C", text: "checkpointLocation" }
      - { id: "D", text: "cloudFiles.schemaEvolutionMode" }
    correct_choice_ids: ["A"]
    tags: ["auto-loader", "schema-evolution"]
    difficulty: 2
    rationale:
      correct: "cloudFiles.schemaLocation specifies a directory where Auto Loader persists the inferred schema. On stream restart, it reads the saved schema instead of re-inferring, and it writes schema evolution updates to the same location."
      per_choice:
        A: "Correct. cloudFiles.schemaLocation is the dedicated option that stores the inferred and evolved schema to a persistent directory."
        B: "Incorrect. cloudFiles.inferColumnTypes enables type inference (e.g., integers vs. strings) but does not control where the schema is stored."
        C: "Incorrect. checkpointLocation stores Structured Streaming progress offsets and commit log, not the Auto Loader schema."
        D: "Incorrect. cloudFiles.schemaEvolutionMode controls how schema changes are handled (e.g., addNewColumns, rescue) but does not specify the storage path for the schema."
    source_ref: "https://docs.databricks.com/en/ingestion/auto-loader/schema.html"

  # ── 2. Delta Lake ACID Guarantees ────────────────────────────

  - type: "single_select"
    intro: "Delta Lake provides ACID transactions on top of cloud object storage by maintaining a transaction log."
    prompt: "Which property of ACID transactions does the Delta Lake transaction log primarily enforce to prevent readers from seeing partially written data?"
    choices:
      - { id: "A", text: "Atomicity" }
      - { id: "B", text: "Consistency" }
      - { id: "C", text: "Isolation" }
      - { id: "D", text: "Durability" }
    correct_choice_ids: ["A"]
    tags: ["delta-lake", "acid"]
    difficulty: 2
    rationale:
      correct: "Atomicity ensures that each transaction either fully commits (log entry written) or fully aborts. Readers only see committed log entries, so partial writes are never visible."
      per_choice:
        A: "Correct. The transaction log makes writes atomic — a commit is visible only after its JSON log entry is fully written, preventing readers from seeing partial results."
        B: "Incorrect. Consistency refers to data satisfying defined constraints (e.g., NOT NULL, CHECK). While Delta supports constraints, the log's primary role is atomicity."
        C: "Incorrect. Isolation controls concurrent access levels (e.g., WriteSerializable). It prevents dirty reads between concurrent writers, but the mechanism of hiding partial writes is atomicity."
        D: "Incorrect. Durability ensures committed data survives system failures by being persisted to stable storage. Delta relies on the cloud storage layer for durability."
    source_ref: "https://docs.databricks.com/en/delta/index.html"

  # ── 3. OPTIMIZE + ZORDER ─────────────────────────────────────

  - type: "single_select"
    prompt: "After running OPTIMIZE with ZORDER BY on a Delta table, what is the primary benefit for downstream queries?"
    choices:
      - { id: "A", text: "It reduces the number of data files by compacting small files" }
      - { id: "B", text: "It co-locates related data within files to improve data-skipping effectiveness" }
      - { id: "C", text: "It creates secondary indexes on the specified columns" }
      - { id: "D", text: "It partitions the table by the specified columns" }
    correct_choice_ids: ["B"]
    tags: ["delta-lake", "optimize", "zorder"]
    difficulty: 2
    rationale:
      correct: "ZORDER BY reorders data within files using a space-filling curve so that values of the specified columns are co-located. This maximizes data-skipping efficiency by tightening the min/max statistics per file."
      per_choice:
        A: "Incorrect. File compaction is a benefit of OPTIMIZE alone (without ZORDER). ZORDER adds the data co-location optimization on top of compaction."
        B: "Correct. ZORDER BY co-locates related values, which makes per-file min/max statistics more selective, enabling Delta to skip more files during query execution."
        C: "Incorrect. Delta Lake does not create secondary indexes. ZORDER improves data-skipping via statistics, not indexing."
        D: "Incorrect. ZORDER is not partitioning. Partitioning splits data into separate directories. ZORDER reorders data within files across existing partitions."
    source_ref: "https://docs.databricks.com/en/delta/optimize.html"

  # ── 4. VACUUM Behavior ──────────────────────────────────────

  - type: "single_select"
    intro: "VACUUM removes data files that are no longer referenced by the Delta transaction log."
    prompt: "What is the default retention threshold used by VACUUM on a Delta table?"
    choices:
      - { id: "A", text: "24 hours" }
      - { id: "B", text: "7 days" }
      - { id: "C", text: "30 days" }
      - { id: "D", text: "90 days" }
    correct_choice_ids: ["B"]
    tags: ["delta-lake", "vacuum"]
    difficulty: 1
    rationale:
      correct: "Delta Lake defaults to a 7-day (168-hour) retention threshold for VACUUM. Files older than this threshold that are no longer in the current table version can be deleted."
      per_choice:
        A: "Incorrect. 24 hours is too short. Using such a low retention can break time travel and concurrent readers. The default is 7 days."
        B: "Correct. The default retention is 7 days (168 hours), providing a safe window for time travel queries and long-running jobs."
        C: "Incorrect. 30 days is not the default. Users may configure longer retention, but the out-of-the-box setting is 7 days."
        D: "Incorrect. 90 days is not the default retention period for VACUUM."
    source_ref: "https://docs.databricks.com/en/delta/vacuum.html"

  # ── 5. Change Data Feed ──────────────────────────────────────

  - type: "multi_select"
    intro: "Change Data Feed (CDF) records row-level changes (inserts, updates, deletes) made to a Delta table."
    prompt: "Which of the following are valid values of the _change_type column when reading a Delta table's Change Data Feed? (Select all that apply)"
    choices:
      - { id: "A", text: "insert" }
      - { id: "B", text: "update_preimage" }
      - { id: "C", text: "update_postimage" }
      - { id: "D", text: "delete" }
      - { id: "E", text: "upsert" }
    correct_choice_ids: ["A", "B", "C", "D"]
    tags: ["delta-lake", "change-data-feed"]
    difficulty: 2
    rationale:
      correct: "CDF records four change types: insert, update_preimage (row before update), update_postimage (row after update), and delete. There is no upsert change type."
      per_choice:
        A: "Correct. insert indicates a newly added row."
        B: "Correct. update_preimage captures the row state before an update."
        C: "Correct. update_postimage captures the row state after an update."
        D: "Correct. delete indicates a removed row."
        E: "Incorrect. upsert is not a CDF change type. MERGE operations that insert produce insert rows, and those that update produce update_preimage/update_postimage pairs."
    source_ref: "https://docs.databricks.com/en/delta/delta-change-data-feed.html"

  # ── 6. Structured Streaming Checkpointing ────────────────────

  - type: "single_select"
    prompt: "In Structured Streaming, what does the checkpoint location store?"
    choices:
      - { id: "A", text: "The output data written by the stream" }
      - { id: "B", text: "The streaming query progress offsets and commit log" }
      - { id: "C", text: "The schema of the source data" }
      - { id: "D", text: "A snapshot of the Spark driver's memory state" }
    correct_choice_ids: ["B"]
    tags: ["structured-streaming", "checkpointing"]
    difficulty: 2
    rationale:
      correct: "The checkpoint location stores the offsets (which data has been consumed from sources), the commit log (which micro-batches have been completed), and any streaming aggregation state."
      per_choice:
        A: "Incorrect. Output data is written to the sink (e.g., Delta table, Kafka). The checkpoint stores metadata about processing progress, not the data itself."
        B: "Correct. It stores source offsets, the commit log tracking completed batches, and stateful operator state, enabling exactly-once fault recovery."
        C: "Incorrect. Schema storage for Auto Loader uses cloudFiles.schemaLocation. The checkpoint does not store source schemas."
        D: "Incorrect. Structured Streaming does not snapshot the driver's heap. It stores serialized offsets and operator state."
    source_ref: "https://docs.databricks.com/en/structured-streaming/checkpoint.html"

  # ── 7. Watermark Semantics ───────────────────────────────────

  - type: "single_select"
    intro: "Watermarking in Structured Streaming defines a threshold for how late data can arrive before being dropped from stateful aggregations."
    prompt: "What happens to event-time records that arrive after the watermark threshold has been exceeded?"
    choices:
      - { id: "A", text: "They are written to a dead-letter queue" }
      - { id: "B", text: "They are dropped and not included in aggregation results" }
      - { id: "C", text: "They trigger a recomputation of all prior windows" }
      - { id: "D", text: "They are buffered until the next trigger interval" }
    correct_choice_ids: ["B"]
    tags: ["structured-streaming", "watermark"]
    difficulty: 2
    rationale:
      correct: "Records arriving later than the watermark threshold are considered too late. Spark drops them to bound the state that must be maintained for aggregations."
      per_choice:
        A: "Incorrect. Structured Streaming does not have a built-in dead-letter queue for late data. Late records are silently dropped."
        B: "Correct. Late records beyond the watermark are dropped. This allows Spark to evict old state and bound memory usage."
        C: "Incorrect. Recomputation of prior windows would negate the purpose of watermarking, which is to limit state. Windows past the watermark are finalized."
        D: "Incorrect. Buffering late data would grow state unboundedly, which is exactly what watermarking prevents."
    source_ref: "https://docs.databricks.com/en/structured-streaming/watermark.html"

  # ── 8. Trigger Modes ─────────────────────────────────────────

  - type: "single_select"
    prompt: "Which Structured Streaming trigger mode processes all available data in a single micro-batch and then stops the stream?"
    choices:
      - { id: "A", text: "Trigger.ProcessingTime(\"10 seconds\")" }
      - { id: "B", text: "Trigger.Once()" }
      - { id: "C", text: "Trigger.Continuous(\"1 second\")" }
      - { id: "D", text: "Trigger.AvailableNow()" }
    correct_choice_ids: ["D"]
    tags: ["structured-streaming", "triggers"]
    difficulty: 3
    rationale:
      correct: "Trigger.AvailableNow() processes all available data in multiple micro-batches (respecting maxFilesPerTrigger/maxBytesPerTrigger) and then stops. Unlike Trigger.Once(), it can process data incrementally across batches."
      per_choice:
        A: "Incorrect. ProcessingTime runs continuously, triggering a new micro-batch at the specified interval. It does not stop after processing."
        B: "Incorrect. Trigger.Once() processes all available data in a single micro-batch and stops, but it ignores rate limits. AvailableNow() is the recommended replacement that respects rate limits."
        C: "Incorrect. Trigger.Continuous is an experimental low-latency mode that processes records one at a time. It runs indefinitely."
        D: "Correct. AvailableNow() processes all available data (potentially across multiple micro-batches for rate limiting) and then terminates the stream."
    source_ref: "https://docs.databricks.com/en/structured-streaming/triggers.html"

  # ── 9. Unity Catalog Permissions ─────────────────────────────

  - type: "single_select"
    intro: "Unity Catalog provides a three-level namespace: catalog.schema.table."
    prompt: "In Unity Catalog, which privilege must be granted on a schema to allow a user to create tables within that schema?"
    choices:
      - { id: "A", text: "SELECT" }
      - { id: "B", text: "USE SCHEMA" }
      - { id: "C", text: "CREATE TABLE" }
      - { id: "D", text: "ALL PRIVILEGES" }
    correct_choice_ids: ["C"]
    tags: ["unity-catalog", "permissions"]
    difficulty: 2
    rationale:
      correct: "The CREATE TABLE privilege on a schema specifically allows the grantee to create new tables in that schema. USE SCHEMA is also needed to access the schema, but it alone does not grant creation rights."
      per_choice:
        A: "Incorrect. SELECT allows reading data from existing tables. It does not grant the ability to create new tables."
        B: "Incorrect. USE SCHEMA allows navigating into the schema and listing its objects, but it does not grant permission to create new objects."
        C: "Correct. CREATE TABLE is the specific privilege required to create tables within a schema."
        D: "Incorrect. ALL PRIVILEGES grants every available privilege including CREATE TABLE, but it is overly broad. The question asks which specific privilege is needed."
    source_ref: "https://docs.databricks.com/en/data-governance/unity-catalog/manage-privileges/privileges.html"

  # ── 10. Medallion Architecture ───────────────────────────────

  - type: "single_select"
    prompt: "In the medallion (multi-hop) architecture, what is the primary purpose of the Silver layer?"
    choices:
      - { id: "A", text: "Store raw, unprocessed data exactly as ingested" }
      - { id: "B", text: "Provide cleaned, conformed, and deduplicated data" }
      - { id: "C", text: "Serve aggregated business-level metrics and KPIs" }
      - { id: "D", text: "Archive historical data for compliance" }
    correct_choice_ids: ["B"]
    tags: ["medallion-architecture"]
    difficulty: 1
    rationale:
      correct: "The Silver layer contains data that has been cleaned, validated, deduplicated, and conformed to a standard schema. It serves as the enterprise-wide source of truth for further transformations."
      per_choice:
        A: "Incorrect. Storing raw, unprocessed data is the role of the Bronze layer. Bronze preserves the original data for reprocessing and auditing."
        B: "Correct. Silver applies data quality rules: deduplication, filtering, schema conformance, and type casting, producing a reliable intermediate dataset."
        C: "Incorrect. Aggregated business metrics are the role of the Gold layer. Gold tables are optimized for reporting and analytics consumption."
        D: "Incorrect. Archiving is not a specific layer function. Compliance data retention can be handled at any layer using Delta time travel and long retention."
    source_ref: "https://docs.databricks.com/en/lakehouse/medallion.html"

  # ── 11. Delta Isolation Levels ───────────────────────────────

  - type: "single_select"
    intro: "Delta Lake supports two isolation levels for concurrent operations on a table."
    prompt: "What is the default isolation level for Delta Lake write operations on Databricks?"
    choices:
      - { id: "A", text: "Read Committed" }
      - { id: "B", text: "Serializable" }
      - { id: "C", text: "WriteSerializable" }
      - { id: "D", text: "Snapshot Isolation" }
    correct_choice_ids: ["C"]
    tags: ["delta-lake", "isolation-levels"]
    difficulty: 3
    rationale:
      correct: "Delta Lake defaults to WriteSerializable isolation. This allows concurrent reads during writes but serializes conflicting writes. It offers a good balance of consistency and throughput."
      per_choice:
        A: "Incorrect. Read Committed is a common RDBMS isolation level but is not used by Delta Lake."
        B: "Incorrect. Serializable is the strictest level Delta supports, but it is not the default. It can be enabled per-table for stricter conflict detection."
        C: "Correct. WriteSerializable is the default. It ensures writes are serializable while allowing concurrent appends to succeed as long as they don't conflict."
        D: "Incorrect. Snapshot Isolation is not an isolation level offered by Delta Lake."
    source_ref: "https://docs.databricks.com/en/delta/isolation-level.html"

  # ── 12. Deletion Vectors ─────────────────────────────────────

  - type: "single_select"
    intro: "Deletion vectors are a Delta Lake storage optimization feature."
    prompt: "How do deletion vectors improve DELETE and UPDATE performance on Delta tables?"
    choices:
      - { id: "A", text: "They create a secondary index to locate rows faster" }
      - { id: "B", text: "They mark rows as deleted in a bitmap without rewriting entire data files" }
      - { id: "C", text: "They compress data files to reduce storage costs" }
      - { id: "D", text: "They move deleted rows to a separate archive table" }
    correct_choice_ids: ["B"]
    tags: ["delta-lake", "deletion-vectors"]
    difficulty: 3
    rationale:
      correct: "Deletion vectors store a bitmap of invalidated rows for each data file. Instead of rewriting the entire Parquet file on delete/update, only the small deletion vector file is written, dramatically reducing write amplification."
      per_choice:
        A: "Incorrect. Deletion vectors are not indexes. They are bitmaps that mark which rows in a file should be excluded from reads."
        B: "Correct. Deletion vectors avoid costly file rewrites by recording which rows are logically deleted in a compact bitmap file alongside the original data file."
        C: "Incorrect. Deletion vectors do not perform data compression. They reduce write amplification, not storage size."
        D: "Incorrect. Rows are not physically moved. They remain in the original file but are marked as deleted in the vector bitmap."
    source_ref: "https://docs.databricks.com/en/delta/deletion-vectors.html"

  # ── 13. Stream-Static Join Constraints ───────────────────────

  - type: "multi_select"
    prompt: "Which of the following statements about stream-static joins in Structured Streaming are correct? (Select all that apply)"
    choices:
      - { id: "A", text: "The static side is re-read on every micro-batch trigger" }
      - { id: "B", text: "Only inner joins and left outer joins (stream on left) are supported" }
      - { id: "C", text: "The streaming side can be on either side of the join" }
      - { id: "D", text: "Stream-static joins do not support watermark-based state cleanup" }
    correct_choice_ids: ["A", "B"]
    tags: ["structured-streaming", "joins"]
    difficulty: 3
    rationale:
      correct: "In stream-static joins, the static DataFrame is re-read on each trigger to pick up changes. Only inner joins and left outer joins with the stream on the left side are supported."
      per_choice:
        A: "Correct. The static side is not cached across batches — it is re-evaluated on each micro-batch trigger to reflect the latest state of the static data."
        B: "Correct. Structured Streaming supports inner joins and left outer joins with the stream as the left table for stream-static joins. Right and full outer joins with static on the right are not supported."
        C: "Incorrect. The streaming side must be the driving (left) side when using outer joins. For inner joins the stream can be on either side, but in practice stream-static means the stream drives the join."
        D: "Incorrect. Stream-static joins do not create streaming state, so watermarks are not needed — there is no state to clean up. This statement is misleading because it implies a limitation."
    source_ref: "https://docs.databricks.com/en/structured-streaming/joins.html"

  # ── 14. MERGE Semantics ──────────────────────────────────────

  - type: "multi_select"
    intro: "The MERGE INTO command performs upserts by matching source rows to target rows using a condition."
    prompt: "Which of the following are valid clauses in a Delta Lake MERGE INTO statement? (Select all that apply)"
    choices:
      - { id: "A", text: "WHEN MATCHED THEN UPDATE" }
      - { id: "B", text: "WHEN NOT MATCHED THEN INSERT" }
      - { id: "C", text: "WHEN NOT MATCHED BY SOURCE THEN DELETE" }
      - { id: "D", text: "WHEN NOT MATCHED BY SOURCE THEN INSERT" }
    correct_choice_ids: ["A", "B", "C"]
    tags: ["delta-lake", "merge"]
    difficulty: 3
    rationale:
      correct: "Delta Lake MERGE supports WHEN MATCHED (update/delete), WHEN NOT MATCHED (insert), and WHEN NOT MATCHED BY SOURCE (update/delete target rows with no source match). You cannot INSERT in a WHEN NOT MATCHED BY SOURCE clause."
      per_choice:
        A: "Correct. WHEN MATCHED THEN UPDATE sets columns on target rows that match source rows."
        B: "Correct. WHEN NOT MATCHED THEN INSERT adds source rows that have no match in the target."
        C: "Correct. WHEN NOT MATCHED BY SOURCE THEN DELETE removes target rows that have no corresponding source row, useful for full synchronization."
        D: "Incorrect. WHEN NOT MATCHED BY SOURCE only supports UPDATE and DELETE actions, not INSERT. Inserting makes no sense when the source has no matching row."
    source_ref: "https://docs.databricks.com/en/delta/merge.html"

  # ── 15. Delta Table Constraints ──────────────────────────────

  - type: "multi_select"
    intro: "Delta Lake supports informational and enforced constraints to ensure data quality."
    prompt: "Which types of constraints can be defined on a Delta Lake table on Databricks? (Select all that apply)"
    choices:
      - { id: "A", text: "NOT NULL constraints on columns" }
      - { id: "B", text: "CHECK constraints with arbitrary SQL expressions" }
      - { id: "C", text: "UNIQUE constraints enforced at write time" }
      - { id: "D", text: "PRIMARY KEY constraints (informational, not enforced)" }
    correct_choice_ids: ["A", "B", "D"]
    tags: ["delta-lake", "constraints"]
    difficulty: 3
    rationale:
      correct: "Delta Lake supports enforced NOT NULL and CHECK constraints that reject violating writes. PRIMARY KEY and FOREIGN KEY are informational only (used by query optimizers) and not enforced. UNIQUE constraints are not supported."
      per_choice:
        A: "Correct. NOT NULL constraints are enforced — any write that includes a null value in the constrained column is rejected."
        B: "Correct. CHECK constraints accept arbitrary boolean SQL expressions and enforce them on every write. For example: CHECK (age > 0)."
        C: "Incorrect. Delta Lake does not support enforced UNIQUE constraints. Uniqueness must be enforced at the application level or via MERGE logic."
        D: "Correct. PRIMARY KEY constraints exist but are informational only — they are not enforced at write time. They can be used by query optimizers for join planning."
    source_ref: "https://docs.databricks.com/en/tables/constraints.html"
