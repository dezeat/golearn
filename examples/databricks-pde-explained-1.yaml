  # ── 13. Structured Streaming Checkpointing ──────────────────
  - type: "single_select"
    prompt: "In Structured Streaming, what does the checkpoint location store?"
    choices:
      - { id: "1", text: "The output data written by the stream" }
      - { id: "2", text: "The streaming query progress offsets and commit log" }
      - { id: "3", text: "The schema of the source data" }
      - { id: "4", text: "A snapshot of the Spark driver's memory state" }
    correct_choice_ids: ["2"]
    tags: ["structured-streaming", "checkpointing"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/structured-streaming/checkpoint.html"
    rationale:
      correct: "The checkpoint stores three things: (1) the *offsets* from the source (e.g., which Kafka offsets or Delta table versions have been consumed), (2) the *commit log* tracking which micro-batch IDs have been fully written to the sink, and (3) any *stateful operator state* (e.g., aggregation running totals, stream-stream join buffers). Together, these allow Structured Streaming to resume a failed stream exactly where it stopped, with exactly-once guarantees — without reprocessing old data or missing new data."
      per_choice:
        1: "Incorrect. Output data is written to the sink (Delta table, Kafka, etc.). The checkpoint stores only operational metadata about what has been processed."
        2: "Correct. Offsets, the commit log, and stateful operator state are all stored in the checkpoint location."
        3: "Incorrect. Auto Loader schemas are stored in `cloudFiles.schemaLocation`. The Structured Streaming checkpoint does not store source schemas."
        4: "Incorrect. Spark does not snapshot the driver heap. Operator state is serialized and written to the checkpoint as structured files."

  # ── 14. Watermark Semantics ──────────────────────────────────
  - type: "single_select"
    intro: "Watermarking in Structured Streaming defines a threshold for how late data can arrive before being dropped from stateful aggregations."
    prompt: "What happens to event-time records that arrive after the watermark threshold has been exceeded?"
    choices:
      - { id: "1", text: "They are written to a dead-letter queue" }
      - { id: "2", text: "They are dropped and not included in aggregation results" }
      - { id: "3", text: "They trigger a recomputation of all prior windows" }
      - { id: "4", text: "They are buffered until the next trigger interval" }
    correct_choice_ids: ["2"]
    tags: ["structured-streaming", "watermark"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/structured-streaming/watermarks.html"
    rationale:
      correct: "The watermark is defined as `withWatermark('eventTime', '10 minutes')`, which tells Structured Streaming that the current threshold is `max observed event time - 10 minutes`. Any record whose event time is earlier than this threshold is considered too late and is *silently dropped* from stateful aggregations. This bounded lateness is what allows Spark to safely evict old aggregation state from memory — once the watermark surpasses a window, that window's state can be garbage-collected."
      per_choice:
        1: "Incorrect. Structured Streaming has no built-in dead-letter queue. Late records are silently discarded. If you need to capture late records, you must implement your own logic using `foreachBatch`."
        2: "Correct. Records whose event time is below the watermark threshold are dropped, allowing Spark to bound and garbage-collect state."
        3: "Incorrect. Recomputing prior finalized windows would require retaining all state indefinitely — exactly what watermarking is designed to prevent."
        4: "Incorrect. Buffering indefinitely would grow state without bound, defeating the purpose. Only records within the watermark threshold are buffered; records beyond it are discarded."

  # ── 15. Trigger Modes ────────────────────────────────────────
  # FIXED: original prompt said "single micro-batch" — AvailableNow uses MULTIPLE batches.
  - type: "single_select"
    prompt: "Which Structured Streaming trigger mode processes all available data across multiple right-sized micro-batches and then stops the stream — and is the recommended replacement for the deprecated Trigger.Once()?"
    choices:
      - { id: "1", text: "Trigger.ProcessingTime('10 seconds')" }
      - { id: "2", text: "Trigger.Once()" }
      - { id: "3", text: "Trigger.Continuous('1 second')" }
      - { id: "4", text: "Trigger.AvailableNow()" }
    correct_choice_ids: ["4"]
    tags: ["structured-streaming", "triggers"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/structured-streaming/triggers.html"
    rationale:
      correct: "`Trigger.AvailableNow()` (available from DBR 10.4 / Spark 3.3) replaced the deprecated `Trigger.Once()` for scheduled incremental batch workloads. The key difference: `Once()` forced all available data into a *single* micro-batch regardless of volume, which could cause OOM or overwhelm the sink. `AvailableNow()` respects rate-limiting options (e.g., `maxBytesPerTrigger`, `maxFilesPerTrigger`) and processes data across *multiple* right-sized micro-batches, then stops the stream. `Trigger.Once()` is deprecated since DBR 11.3 LTS."
      per_choice:
        1: "Incorrect. `ProcessingTime` runs the stream *continuously*, triggering new micro-batches at the specified time interval. The stream does not stop on its own."
        2: "Incorrect. `Trigger.Once()` is *deprecated* since DBR 11.3 LTS. It processes all available data in a single batch ignoring rate limits, and is now superseded by `AvailableNow()`."
        3: "Incorrect. `Trigger.Continuous` is an experimental Spark OSS feature that Databricks does not support. The docs recommend using the real-time mode (`.trigger(realTime='...')`) instead for ultra-low-latency workloads."
        4: "Correct. `AvailableNow()` processes all currently available data across optimally sized micro-batches (respecting rate limits) and then terminates the stream."

  # ── 16. Stream-Static Join Constraints ──────────────────────
  # FIXED: original choice 2 was oversimplified (stream can be on either side for inner;
  # left outer requires stream on left, right outer requires stream on right).
  - type: "multi_select"
    prompt: "Which of the following statements about stream-static joins in Structured Streaming are correct? (Select all that apply)"
    choices:
      - { id: "1", text: "The static Delta table is re-read on every micro-batch trigger to pick up its latest version" }
      - { id: "2", text: "Stream-static joins are stateless — no watermark or state cleanup is needed" }
      - { id: "3", text: "When the stream is on the LEFT, both inner joins and LEFT OUTER joins are supported" }
      - { id: "4", text: "Stream-static joins accumulate state proportional to the number of join keys seen" }
    correct_choice_ids: ["1", "2", "3"]
    tags: ["structured-streaming", "joins"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/aws/en/transform/join"
    rationale:
      correct: "Stream-static joins are stateless because only newly arrived streaming records are joined with the current static snapshot — there is no need to buffer prior streaming records. The static Delta table is re-evaluated on each micro-batch trigger, so the join always uses the latest committed version of the Delta table. When the stream is the left side: inner and left outer joins are supported. When the stream is the right side: inner and right outer joins are supported."
      per_choice:
        1: "Correct. For Delta static sources, Databricks re-reads the latest valid table version on each trigger, so changes to the reference table are automatically picked up in subsequent micro-batches."
        2: "Correct. Stream-static joins are entirely stateless — only the current micro-batch of streaming records is joined with a point-in-time snapshot of the static table. No streaming state accumulates, so watermarks are unnecessary."
        3: "Correct. With the stream on the left side, inner joins and left outer joins are both supported. For stream-on-right, inner and right outer joins apply."
        4: "Incorrect. Accumulating state proportional to join keys is a characteristic of *stream-stream* (stateful) joins, not stream-static joins."

  # ── 17. foreachBatch ────────────────────────────────────────
  - type: "single_select"
    prompt: "A data engineer uses foreachBatch to write streaming micro-batches to two different Delta tables. Which statement is true about achieving exactly-once semantics in this pattern?"
    choices:
      - { id: "1", text: "foreachBatch guarantees exactly-once writes automatically" }
      - { id: "2", text: "The batch ID must be used in idempotent write logic (e.g., a MERGE condition) to prevent duplicate writes on retry" }
      - { id: "3", text: "Using multiple write operations inside foreachBatch is not supported" }
      - { id: "4", text: "foreachBatch can only write to one sink per invocation" }
    correct_choice_ids: ["2"]
    tags: ["structured-streaming", "foreachbatch", "exactly-once"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/structured-streaming/foreach.html"
    rationale:
      correct: "`foreachBatch(batchDF, batchId)` gives you a batch DataFrame and a monotonically increasing integer `batchId` for each micro-batch. If the micro-batch fails and is retried, the same `batchId` is reused. To achieve exactly-once semantics, you must implement idempotent write logic yourself — for example, checking whether a record with that `batchId` already exists before inserting, or using the `batchId` in a MERGE condition. `foreachBatch` does not provide this automatically."
      per_choice:
        1: "Incorrect. `foreachBatch` does not provide automatic exactly-once guarantees. The Structured Streaming engine guarantees the batch will be executed at least once; achieving exactly-once requires the user to implement idempotent write logic."
        2: "Correct. By using the `batchId` inside a MERGE or conditional INSERT (e.g., as a deduplicated marker), you can ensure replayed batches produce the same result as the original run."
        3: "Incorrect. Multiple write operations within a single `foreachBatch` call are explicitly supported and are a primary use case — e.g., writing enriched data to a gold table and a summary to a reporting table in the same batch."
        4: "Incorrect. `foreachBatch` can write to any number of sinks within a single invocation. The batch DataFrame can be cached and written multiple times."

  # ── 18. Stateful Streaming Aggregation Modes ────────────────
  - type: "single_select"
    prompt: "A streaming query performs a COUNT aggregation on a tumbling event-time window with a watermark. Which output mode must be used to write results to a Delta Lake sink?"
    choices:
      - { id: "1", text: "Append mode" }
      - { id: "2", text: "Update mode" }
      - { id: "3", text: "Complete mode" }
      - { id: "4", text: "Both Append and Update mode are valid; they produce equivalent results" }
    correct_choice_ids: ["1"]
    tags: ["structured-streaming", "output-modes", "windowed-aggregation"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/structured-streaming/index.html"
    rationale:
      correct: "When a watermark is defined on a windowed aggregation, Append mode becomes valid: once the watermark surpasses a window's end time, Spark knows no more late data can arrive for that window, so it finalizes the result and *appends* it exactly once to the sink. Without a watermark, Append mode is not supported for aggregations because Spark cannot know when a window is finalized. Update mode emits *every intermediate update* to each window's aggregate, not just the final result — which can produce multiple rows for the same window in the sink, unsuitable for most Delta tables. Complete mode rewrites the entire aggregation result every trigger, which is expensive and does not scale."
      per_choice:
        1: "Correct. With a watermark, Append mode writes finalized window results exactly once, making it the most efficient choice for Delta sinks with windowed aggregations."
        2: "Incorrect. Update mode emits each intermediate change to an aggregate, not just the final value. For a windowed COUNT, this means you get a row for every micro-batch that received records for that window, not just the final count."
        3: "Incorrect. Complete mode rewrites the full aggregation result to the sink on every trigger. For long-running streams this becomes increasingly expensive and is impractical for large Delta tables."
        4: "Incorrect. Append and Update modes produce very different outputs for windowed aggregations. Append (with watermark) emits one final row per window; Update emits multiple intermediate rows per window."

