  # ── 21. Unity Catalog Permissions ───────────────────────────
  - type: "single_select"
    intro: "Unity Catalog provides a three-level namespace: catalog.schema.table."
    prompt: "In Unity Catalog, which privilege must be granted on a schema to allow a user to create tables within that schema?"
    choices:
      - { id: "1", text: "SELECT" }
      - { id: "2", text: "USE SCHEMA" }
      - { id: "3", text: "CREATE TABLE" }
      - { id: "4", text: "ALL PRIVILEGES" }
    correct_choice_ids: ["3"]
    tags: ["unity-catalog", "permissions"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/data-governance/unity-catalog/manage-privileges/privileges.html"
    rationale:
      correct: "`CREATE TABLE` on the schema is the specific privilege required to create new tables within it. Note that a user typically also needs `USE CATALOG` on the parent catalog and `USE SCHEMA` on the schema to navigate the namespace — but `USE SCHEMA` alone does not grant creation rights; only `CREATE TABLE` does. On the catalog level, the `CREATE SCHEMA` privilege is needed to create new schemas."
      per_choice:
        1: "Incorrect. `SELECT` allows reading data from existing tables in the schema. It does not grant object creation rights."
        2: "Incorrect. `USE SCHEMA` allows navigating into the schema and listing its objects, but grants no ability to create new objects."
        3: "Correct. `CREATE TABLE` is the specific privilege needed to create tables within a schema."
        4: "Incorrect. `ALL PRIVILEGES` would work but is far too broad. The minimum required privilege is `CREATE TABLE`."

  # ── 22. Unity Catalog Row-Level Security ────────────────────
  - type: "single_select"
    prompt: "How is row-level security (row filters) implemented in Unity Catalog?"
    choices:
      - { id: "1", text: "By partitioning the table on a column containing the user's group membership" }
      - { id: "2", text: "By creating a view that filters rows using the current_user() function and granting access to the view instead of the table" }
      - { id: "3", text: "By applying a row filter function to the table using ALTER TABLE … SET ROW FILTER" }
      - { id: "4", text: "Row-level security is not supported in Unity Catalog — only column masking is available" }
    correct_choice_ids: ["3"]
    tags: ["unity-catalog", "security", "row-level-security"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/tables/row-and-column-filters.html"
    rationale:
      correct: "Unity Catalog supports native row-level security via **row filter functions** applied directly to tables. You create a SQL function that returns a boolean and attach it to a table: `ALTER TABLE my_table SET ROW FILTER my_filter_fn ON (col)`. Any query against the table automatically applies the filter — users only see rows where the function returns `true`. The filter function can use `current_user()` or `is_account_group_member()` to make the filter dynamic per user. Unlike view-based approaches, the filter is enforced directly on the table object itself."
      per_choice:
        1: "Incorrect. Partitioning is a physical layout strategy, not a security mechanism. Users can still query any partition unless access is controlled at a higher level."
        2: "Incorrect. Creating security views is a legacy pattern and does not prevent direct access to the underlying table. Unity Catalog's native row filter is cleaner and applied at the table level."
        3: "Correct. `ALTER TABLE … SET ROW FILTER` attaches a filter function to the table, enforcing row-level security transparently for all queries."
        4: "Incorrect. Both row filters and column masks are supported in Unity Catalog."

  # ── 23. Unity Catalog: Managed vs External Tables ───────────
  - type: "multi_select"
    prompt: "Which of the following statements are true about Unity Catalog MANAGED tables? (Select all that apply)"
    choices:
      - { id: "1", text: "Dropping a managed table deletes both the metadata and the underlying data files" }
      - { id: "2", text: "Managed table data is stored in the Unity Catalog metastore root storage or a catalog/schema storage location" }
      - { id: "3", text: "You must specify a LOCATION when creating a managed table" }
      - { id: "4", text: "Predictive Optimization is only available for managed tables" }
    correct_choice_ids: ["1", "2", "4"]
    tags: ["unity-catalog", "managed-tables"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/tables/managed.html"
    rationale:
      correct: "Unity Catalog managed tables are fully lifecycle-managed by Databricks. The data is stored at a location determined by the hierarchy of storage credentials configured on the catalog or schema (or the metastore root if none is set). Dropping a managed table deletes both the Delta metadata and the Parquet data files permanently. Predictive Optimization — which automatically runs OPTIMIZE and VACUUM on your behalf — is only available for Unity Catalog managed tables, not for external tables."
      per_choice:
        1: "Correct. Dropping a managed table is destructive — both the table's metadata and all underlying data files are permanently deleted."
        2: "Correct. Managed table data is stored at the Unity Catalog-controlled location (catalog or schema storage root, or metastore root)."
        3: "Incorrect. Managed tables do NOT require a `LOCATION` clause — that would make them external tables. Unity Catalog determines the storage location automatically."
        4: "Correct. Predictive Optimization automatically schedules OPTIMIZE and VACUUM maintenance and is only available for Unity Catalog managed tables."

  # ── 24. Delta Sharing ───────────────────────────────────────
  - type: "single_select"
    prompt: "A company wants to share live Delta table data with a partner company that does NOT use Databricks. Which mechanism is appropriate?"
    choices:
      - { id: "1", text: "Databricks-to-Databricks (D2D) sharing using Delta Sharing with the Databricks recipient type" }
      - { id: "2", text: "Open sharing using Delta Sharing with the 'other' recipient type, providing a token-based activation link" }
      - { id: "3", text: "Export the table as Parquet files to a shared S3 bucket" }
      - { id: "4", text: "Grant the partner direct IAM access to the Delta table's cloud storage location" }
    correct_choice_ids: ["2"]
    tags: ["unity-catalog", "delta-sharing"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/delta-sharing/index.html"
    rationale:
      correct: "Delta Sharing is an open protocol for sharing live data. For partners who do not use Databricks, you use **open sharing**: create a recipient of type `other` in Unity Catalog, which generates an activation link containing a short-lived token. The recipient downloads a credentials file from the link and uses a Delta Sharing-compatible client (available in Python, Pandas, Spark OSS, Power BI, etc.) to read the shared data. The data remains in your storage — nothing is copied. For partners who use Databricks, D2D sharing is simpler (just share to their Databricks account)."
      per_choice:
        1: "Incorrect. D2D sharing requires the recipient to have a Databricks account. The partner in this scenario does not use Databricks."
        2: "Correct. Open sharing with a token-based activation link is the correct mechanism for non-Databricks consumers."
        3: "Incorrect. Exporting to Parquet creates a static snapshot, not live data. It also creates storage overhead and lacks governance."
        4: "Incorrect. Granting direct cloud storage access bypasses Unity Catalog's governance and audit controls entirely — and exposes raw files rather than governed, versioned data."

