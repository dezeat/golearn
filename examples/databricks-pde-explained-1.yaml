  # ── 25. Photon & Serverless ─────────────────────────────────
  - type: "single_select"
    prompt: "Which of the following workloads is LEAST likely to benefit from Photon?"
    choices:
      - { id: "1", text: "A large OPTIMIZE operation compacting millions of small Parquet files" }
      - { id: "2", text: "A SQL query scanning 10 TB with multiple aggregations and joins" }
      - { id: "3", text: "A Pandas UDF that applies a custom Python ML model row-by-row" }
      - { id: "4", text: "A MERGE INTO statement on a 5 TB Delta table" }
    correct_choice_ids: ["3"]
    tags: ["photon", "performance", "udf"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/compute/photon.html"
    rationale:
      correct: "Photon is a native vectorized query engine written in C++ that accelerates SQL and DataFrame operations on structured data. It does not accelerate arbitrary Python code. A Pandas UDF (or scalar Python UDF) that executes custom Python logic row-by-row runs in the Python interpreter, outside Photon's execution path. The data must be serialized out of Photon's columnar format and into Python, the UDF runs, and then results are serialized back. Photon provides no benefit for this Python computation itself — only the surrounding SQL/DataFrame plan can use Photon."
      per_choice:
        1: "Incorrect. OPTIMIZE benefits substantially from Photon — file scanning, sorting for Z-ordering, and writing large compacted files are all accelerated."
        2: "Incorrect. Large SQL scans with aggregations and joins are the primary use case for Photon. Vectorized execution on columnar Parquet data provides large speedups."
        3: "Correct. Python UDFs execute outside Photon's native C++ execution path. Photon cannot accelerate arbitrary Python logic."
        4: "Incorrect. MERGE INTO benefits from Photon, especially for the large inner join and outer join operations that MERGE uses internally."

  # ── 26. Predictive Optimization ─────────────────────────────
  - type: "single_select"
    prompt: "What does Predictive Optimization do for Unity Catalog managed tables?"
    choices:
      - { id: "1", text: "It automatically partitions tables based on observed query patterns" }
      - { id: "2", text: "It automatically schedules and runs OPTIMIZE and VACUUM operations based on observed table activity" }
      - { id: "3", text: "It automatically selects the cheapest cluster type for each query" }
      - { id: "4", text: "It caches frequently accessed tables in memory" }
    correct_choice_ids: ["2"]
    tags: ["delta-lake", "predictive-optimization", "performance"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/optimizations/predictive-optimization.html"
    rationale:
      correct: "Predictive Optimization monitors write activity on Unity Catalog managed tables and automatically schedules OPTIMIZE (compaction, and optionally Z-ordering or liquid clustering maintenance) and VACUUM (old file deletion) operations when the system determines they would provide a meaningful benefit. This eliminates the need to manually schedule maintenance jobs. It is only available for Unity Catalog managed tables — external tables are not supported."
      per_choice:
        1: "Incorrect. Predictive Optimization does not automatically add or change partitioning. Layout changes still require manual intervention (or Liquid Clustering with `CLUSTER BY AUTO`)."
        2: "Correct. Predictive Optimization automatically triggers OPTIMIZE and VACUUM based on observed write patterns and table state."
        3: "Incorrect. Compute selection is a separate concern handled by instance pools, job cluster configurations, and serverless compute — not by Predictive Optimization."
        4: "Incorrect. Disk and memory caching are separate Databricks features (Delta Cache / disk cache). Predictive Optimization does not cache data."

  # ── 27. Spark Shuffle & Skew ────────────────────────────────
  - type: "single_select"
    prompt: "A Spark job performing a join between a large events table and a small lookup table is running slowly because the lookup data is causing excessive shuffle. What is the most effective fix?"
    choices:
      - { id: "1", text: "Increase the number of shuffle partitions with spark.sql.shuffle.partitions" }
      - { id: "2", text: "Force a broadcast join by adding a BROADCAST join hint or setting a suitable spark.sql.autoBroadcastJoinThreshold" }
      - { id: "3", text: "Repartition both DataFrames to the same number of partitions before joining" }
      - { id: "4", text: "Use ZORDER BY on the lookup table's join key column" }
    correct_choice_ids: ["2"]
    tags: ["spark", "performance", "joins", "broadcast"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/optimizations/aqe.html"
    rationale:
      correct: "When one side of a join is small enough to fit in executor memory, a broadcast join eliminates the shuffle entirely. Instead of both sides being shuffled by join key (a sort-merge join), the small table is broadcast (copied) to every executor, and each executor performs a hash lookup locally. You can force this with the `/*+ BROADCAST(small_table) */` hint in SQL or `broadcast(df)` in Python, or by setting `spark.sql.autoBroadcastJoinThreshold` to a size larger than the lookup table (default 10 MB). Databricks' Adaptive Query Execution (AQE) often does this automatically, but explicit hints override it."
      per_choice:
        1: "Incorrect. Increasing shuffle partition count distributes the shuffle work across more tasks, reducing individual task memory pressure — but the shuffle itself still occurs. It does not eliminate the shuffle overhead."
        2: "Correct. A broadcast join sends the small lookup table to every executor and eliminates the shuffle entirely, which is the biggest performance gain for small-large join patterns."
        3: "Incorrect. Pre-repartitioning does not eliminate the shuffle; it just shifts when it occurs. It can sometimes help if the repartition aligns with the join key, but it adds an extra stage."
        4: "Incorrect. ZORDER improves *read* performance via data skipping for selective queries. It has no effect on join shuffle overhead."

  # ── 28. Adaptive Query Execution ────────────────────────────
  - type: "multi_select"
    prompt: "Which of the following are features of Adaptive Query Execution (AQE) in Databricks? (Select all that apply)"
    choices:
      - { id: "1", text: "Dynamically coalescing shuffle partitions to reduce the number of tasks" }
      - { id: "2", text: "Converting sort-merge joins to broadcast hash joins at runtime if one side turns out to be small" }
      - { id: "3", text: "Automatically detecting and handling data skew in joins" }
      - { id: "4", text: "Automatically repartitioning data files on disk to reduce small file counts" }
    correct_choice_ids: ["1", "2", "3"]
    tags: ["spark", "aqe", "performance"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/optimizations/aqe.html"
    rationale:
      correct: "AQE (`spark.sql.adaptive.enabled=true`, enabled by default on Databricks) operates at runtime using actual shuffle statistics. Its three main capabilities are: (1) *Coalescing shuffle partitions* — if many shuffle partitions are tiny after a join, AQE merges them to reduce task overhead. (2) *Converting joins at runtime* — if a join side is estimated large but turns out small after execution, AQE can switch a planned sort-merge join to a faster broadcast hash join. (3) *Skew join handling* — AQE detects skewed partitions (one key has disproportionately many rows) and splits them into smaller sub-partitions."
      per_choice:
        1: "Correct. AQE dynamically coalesces post-shuffle partitions, reducing the overhead of many tiny tasks that would otherwise each open an executor thread."
        2: "Correct. AQE can promote a sort-merge join to a broadcast join at runtime when actual data sizes differ from optimizer estimates."
        3: "Correct. AQE detects join skew and splits hot partitions, distributing the load across more tasks."
        4: "Incorrect. AQE is a query execution optimization — it does not write new files to cloud storage. OPTIMIZE (compaction) and Auto Compaction are the tools for managing file counts on disk."

