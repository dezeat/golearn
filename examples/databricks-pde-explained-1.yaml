pack_version: "0.1.0"
topic:
  slug: "databricks-pde-explained-1"
  name: "Databricks PDE — Explained Practice 1"
questions:

  # ════════════════════════════════════════════════════════════
  # CATEGORY 1: DATA PROCESSING & DELTA LAKE  (~30% of exam)
  # ════════════════════════════════════════════════════════════

  # ── 1. Auto Loader: Schema Inference & Evolution ─────────────
  - type: "single_select"
    intro: "Auto Loader incrementally ingests new data files from cloud storage into Delta Lake tables using Structured Streaming."
    prompt: "When using Auto Loader with cloudFiles format, which option must be set to a persistent path so that Auto Loader can track and evolve the inferred schema across stream restarts?"
    choices:
      - { id: "1", text: "cloudFiles.schemaLocation" }
      - { id: "2", text: "cloudFiles.inferColumnTypes" }
      - { id: "3", text: "checkpointLocation" }
      - { id: "4", text: "cloudFiles.schemaEvolutionMode" }
    correct_choice_ids: ["1"]
    tags: ["auto-loader", "schema-evolution"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/ingestion/auto-loader/schema.html"
    rationale:
      correct: "`cloudFiles.schemaLocation` points to a cloud storage directory where Auto Loader writes the inferred schema as a JSON file after the first run. On subsequent runs and restarts, Auto Loader reads this saved schema rather than re-inferring from scratch. Any schema evolution (e.g., new columns detected) is also written back to this location. Without it, Auto Loader cannot persist schema state between runs."
      per_choice:
        1: "Correct. `cloudFiles.schemaLocation` is the dedicated persistent path for storing and evolving the inferred schema between stream runs."
        2: "Incorrect. `cloudFiles.inferColumnTypes` controls whether Auto Loader tries to infer specific data types (int, timestamp, etc.) instead of defaulting to strings for text-based formats. It is a type inference switch, not a storage path."
        3: "Incorrect. `checkpointLocation` stores Structured Streaming progress (source offsets, committed batch IDs, and operator state). It is required for fault tolerance but does not persist the schema."
        4: "Incorrect. `cloudFiles.schemaEvolutionMode` configures the *behavior* when new columns arrive (e.g., `addNewColumns`, `rescue`, `failOnNewColumns`). It is not a storage path and has no effect without `cloudFiles.schemaLocation` being set."

  # ── 2. Delta Lake ACID Guarantees ────────────────────────────
  - type: "single_select"
    intro: "Delta Lake provides ACID transactions on top of cloud object storage by maintaining a transaction log."
    prompt: "Which property of ACID transactions does the Delta Lake transaction log primarily enforce to prevent readers from seeing partially written data?"
    choices:
      - { id: "1", text: "Atomicity" }
      - { id: "2", text: "Consistency" }
      - { id: "3", text: "Isolation" }
      - { id: "4", text: "Durability" }
    correct_choice_ids: ["1"]
    tags: ["delta-lake", "acid"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/delta/index.html"
    rationale:
      correct: "Atomicity means every write either fully commits or fully aborts — there is no in-between. In Delta Lake, a transaction is only visible to readers once its JSON commit entry has been durably written to `_delta_log/`. Data files may be written to cloud storage first, but they are invisible to readers until the log entry commits them. If a job fails mid-write, the uncommitted files are simply orphaned and cleaned up by VACUUM — readers never see partial results."
      per_choice:
        1: "Correct. Atomicity is enforced by the transaction log commit protocol. A commit is all-or-nothing from the reader's perspective."
        2: "Incorrect. Consistency means data satisfies defined invariants (e.g., NOT NULL, CHECK constraints). Delta does enforce these, but the log's primary guarantee against partial writes is atomicity, not consistency."
        3: "Incorrect. Isolation (specifically WriteSerializable by default) governs *concurrent* transactions — preventing one writer from seeing another writer's uncommitted changes. Preventing *readers* from seeing partial writes is atomicity."
        4: "Incorrect. Durability ensures committed data survives failures. Delta relies on the underlying cloud object storage (S3, ADLS, GCS) for durability once the commit entry is written."

  # ── 3. OPTIMIZE + ZORDER ─────────────────────────────────────
  - type: "single_select"
    prompt: "After running OPTIMIZE with ZORDER BY on a Delta table, what is the primary benefit for downstream queries?"
    choices:
      - { id: "1", text: "It reduces the number of data files by compacting small files" }
      - { id: "2", text: "It co-locates related data within files to improve data-skipping effectiveness" }
      - { id: "3", text: "It creates secondary indexes on the specified columns" }
      - { id: "4", text: "It partitions the table by the specified columns" }
    correct_choice_ids: ["2"]
    tags: ["delta-lake", "optimize", "zorder"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/delta/optimize.html"
    rationale:
      correct: "ZORDER BY applies a multi-dimensional space-filling curve to reorder data within the compacted files so that rows with similar values in the specified columns are physically stored together. This tightens the per-file min/max statistics that Delta records in the transaction log, allowing the query engine to skip entire files when a predicate on a Z-ordered column does not overlap with a file's min/max range. The more selective the statistics, the more files can be skipped, reducing I/O dramatically."
      per_choice:
        1: "Partially correct but incomplete. OPTIMIZE alone (without ZORDER) already performs compaction. ZORDER adds the data co-location layer on top. The *primary* benefit of adding ZORDER is the improved data skipping, not the compaction itself."
        2: "Correct. ZORDER's defining contribution is co-locating related values within files to maximize data-skipping efficiency."
        3: "Incorrect. Delta Lake has no secondary index mechanism. Data skipping works via file-level min/max statistics, not indexes."
        4: "Incorrect. Partitioning and Z-ordering are orthogonal. Partitioning creates separate directory subtrees. ZORDER reorders data *within* the existing files/partitions."

  # ── 4. VACUUM Behavior ──────────────────────────────────────
  - type: "single_select"
    intro: "VACUUM removes data files that are no longer referenced by the Delta transaction log."
    prompt: "What is the default retention threshold used by VACUUM on a Delta table?"
    choices:
      - { id: "1", text: "24 hours" }
      - { id: "2", text: "7 days" }
      - { id: "3", text: "30 days" }
      - { id: "4", text: "90 days" }
    correct_choice_ids: ["2"]
    tags: ["delta-lake", "vacuum"]
    difficulty: easy
    source_ref: "https://docs.databricks.com/en/delta/vacuum.html"
    rationale:
      correct: "The default VACUUM retention period is 7 days (168 hours), set by the `delta.deletedFileRetentionDuration` table property which defaults to `interval 7 days`. This means VACUUM will only delete data files that are (a) no longer referenced by the current table snapshot *and* (b) were last modified more than 7 days ago. The 7-day default is conservative enough to protect concurrent long-running queries and to preserve time-travel access to recent versions."
      per_choice:
        1: "Incorrect. 24-hour retention is below the minimum safe threshold. Running VACUUM with retention under 7 days requires disabling the `spark.databricks.delta.retentionDurationCheck.enabled` safety flag."
        2: "Correct. 7 days is the default, corresponding to `interval 7 days` in the `delta.deletedFileRetentionDuration` table property."
        3: "Incorrect. 30 days is not the default. You can configure longer retention to preserve more time-travel history, but the out-of-the-box setting is 7 days."
        4: "Incorrect. 90 days is not the default VACUUM retention period."

  # ── 5. Change Data Feed ──────────────────────────────────────
  - type: "multi_select"
    intro: "Change Data Feed (CDF) records row-level changes (inserts, updates, deletes) made to a Delta table."
    prompt: "Which of the following are valid values of the _change_type column when reading a Delta table's Change Data Feed? (Select all that apply)"
    choices:
      - { id: "1", text: "insert" }
      - { id: "2", text: "update_preimage" }
      - { id: "3", text: "update_postimage" }
      - { id: "4", text: "delete" }
      - { id: "5", text: "upsert" }
    correct_choice_ids: ["1", "2", "3", "4"]
    tags: ["delta-lake", "change-data-feed"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/delta/delta-change-data-feed.html"
    rationale:
      correct: "CDF produces exactly four `_change_type` values: `insert` (new row added), `update_preimage` (the row's state *before* an update), `update_postimage` (the row's state *after* an update), and `delete` (row removed). Every UPDATE generates a pair — a preimage row and a postimage row sharing the same `_commit_version` — so downstream consumers can compute the exact delta or apply only the latest state."
      per_choice:
        1: "Correct. `insert` is emitted for INSERT and INSERT INTO … SELECT operations."
        2: "Correct. `update_preimage` captures the before-image of a row that was updated — useful for audit trails and computing deltas."
        3: "Correct. `update_postimage` captures the after-image of a row that was updated — the most recent state to apply to a target system."
        4: "Correct. `delete` is emitted when a row is removed via DELETE or a MERGE delete clause."
        5: "Incorrect. `upsert` is not a CDF change type. A MERGE operation that upserts rows will produce either `insert` rows (for new rows) or `update_preimage`/`update_postimage` pairs (for updated rows)."

  # ── 6. Delta Lake Isolation Levels ───────────────────────────
  - type: "single_select"
    intro: "Delta Lake supports two isolation levels for concurrent operations on a table."
    prompt: "What is the default isolation level for Delta Lake write operations on Databricks?"
    choices:
      - { id: "1", text: "Read Committed" }
      - { id: "2", text: "Serializable" }
      - { id: "3", text: "WriteSerializable" }
      - { id: "4", text: "Snapshot Isolation" }
    correct_choice_ids: ["3"]
    tags: ["delta-lake", "isolation-levels"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta/isolation-level.html"
    rationale:
      correct: "Delta Lake defaults to `WriteSerializable` isolation. This level ensures that *write* operations are serializable (no write-write conflicts), while *read* operations use snapshot isolation (each read sees the table state at the start of the transaction). The practical impact: two concurrent appends that touch different files can succeed, but two concurrent MERGE operations that conflict on the same rows will have one fail with a `ConcurrentModificationException`. If you need reads to also be serializable (stronger but lower throughput), you can set `delta.isolationLevel = 'Serializable'` on the table."
      per_choice:
        1: "Incorrect. `Read Committed` is a standard RDBMS isolation level where reads always see the latest committed version. Delta Lake does not implement this level."
        2: "Incorrect. `Serializable` *is* available in Delta Lake and can be set explicitly, but it is not the default because it reduces write concurrency."
        3: "Correct. `WriteSerializable` is the default — writes are serialized against each other, reads are snapshot-isolated. It is a good balance of correctness and throughput."
        4: "Incorrect. `Snapshot Isolation` describes how Delta reads behave *under* WriteSerializable, but it is not an isolation level you can configure independently in Delta Lake's table properties."

  # ── 7. Deletion Vectors ─────────────────────────────────────
  - type: "single_select"
    intro: "Deletion vectors are a Delta Lake storage optimization feature."
    prompt: "How do deletion vectors improve DELETE and UPDATE performance on Delta tables?"
    choices:
      - { id: "1", text: "They create a secondary index to locate rows faster" }
      - { id: "2", text: "They mark rows as deleted in a bitmap without rewriting entire data files" }
      - { id: "3", text: "They compress data files to reduce storage costs" }
      - { id: "4", text: "They move deleted rows to a separate archive table" }
    correct_choice_ids: ["2"]
    tags: ["delta-lake", "deletion-vectors"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta/deletion-vectors.html"
    rationale:
      correct: "Without deletion vectors, a DELETE or UPDATE on a Delta table requires rewriting every Parquet file that contains at least one affected row — even if only one row in a 1 GB file changes. With deletion vectors enabled, Delta instead writes a small bitmap file (the deletion vector) alongside the original Parquet file, recording which row indices are logically deleted. The original file is not rewritten. At read time, the query engine applies the bitmap to filter out deleted rows. Only when OPTIMIZE or REORG TABLE … APPLY (PURGE) runs are the stale rows physically purged via full file rewrites."
      per_choice:
        1: "Incorrect. Deletion vectors are bitmaps that track invalidated row positions — they are not indexes."
        2: "Correct. Deletion vectors avoid costly file rewrites by recording which rows are logically deleted in a compact sidecar bitmap file."
        3: "Incorrect. Deletion vectors reduce write amplification; they do not compress the underlying data files."
        4: "Incorrect. Logically deleted rows remain in the original Parquet file, invisible to readers via the bitmap, until REORG/OPTIMIZE physically removes them."

  # ── 8. Delta MERGE semantics ─────────────────────────────────
  - type: "multi_select"
    intro: "The MERGE INTO command performs upserts by matching source rows to target rows using a condition."
    prompt: "Which of the following are valid clauses in a Delta Lake MERGE INTO statement? (Select all that apply)"
    choices:
      - { id: "1", text: "WHEN MATCHED THEN UPDATE" }
      - { id: "2", text: "WHEN NOT MATCHED THEN INSERT" }
      - { id: "3", text: "WHEN NOT MATCHED BY SOURCE THEN DELETE" }
      - { id: "4", text: "WHEN NOT MATCHED BY SOURCE THEN INSERT" }
    correct_choice_ids: ["1", "2", "3"]
    tags: ["delta-lake", "merge"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta/merge.html"
    rationale:
      correct: "Delta Lake MERGE supports three clause categories: `WHEN MATCHED` (target row has a match in source — supports UPDATE and DELETE), `WHEN NOT MATCHED` or `WHEN NOT MATCHED BY TARGET` (source row has no match in target — supports INSERT only), and `WHEN NOT MATCHED BY SOURCE` (target row has no match in source — supports UPDATE and DELETE). The `WHEN NOT MATCHED BY SOURCE THEN DELETE` clause is especially useful for full-synchronization patterns where you want to remove target rows that disappeared from the source."
      per_choice:
        1: "Correct. `WHEN MATCHED THEN UPDATE SET ...` updates target columns for rows that matched the join condition."
        2: "Correct. `WHEN NOT MATCHED THEN INSERT ...` inserts source rows that had no match in the target."
        3: "Correct. `WHEN NOT MATCHED BY SOURCE THEN DELETE` removes target rows that no longer exist in the source — useful for sync/overwrite patterns."
        4: "Incorrect. `WHEN NOT MATCHED BY SOURCE THEN INSERT` is not a valid action. In this clause, there is no source row to insert from — you can only UPDATE or DELETE the target row."

  # ── 9. Delta Table Constraints ──────────────────────────────
  - type: "multi_select"
    intro: "Delta Lake supports informational and enforced constraints to ensure data quality."
    prompt: "Which types of constraints can be defined on a Delta Lake table on Databricks? (Select all that apply)"
    choices:
      - { id: "1", text: "NOT NULL constraints on columns" }
      - { id: "2", text: "CHECK constraints with arbitrary SQL expressions" }
      - { id: "3", text: "UNIQUE constraints enforced at write time" }
      - { id: "4", text: "PRIMARY KEY constraints (informational, not enforced)" }
    correct_choice_ids: ["1", "2", "4"]
    tags: ["delta-lake", "constraints"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/tables/constraints.html"
    rationale:
      correct: "Delta Lake supports enforced NOT NULL and CHECK constraints — any write violating them raises an error and aborts. PRIMARY KEY (and FOREIGN KEY) constraints are informational only: they are stored in the table metadata and can be used by query optimizers for join planning, but they are *not enforced* at write time — duplicate or null primary key values will not cause a write failure. UNIQUE constraints are not supported at all."
      per_choice:
        1: "Correct. NOT NULL constraints are enforced — writes containing null in a constrained column are rejected with an `AnalysisException`."
        2: "Correct. CHECK constraints accept arbitrary boolean SQL expressions (e.g., `CHECK (price > 0)`) and are enforced on every INSERT, UPDATE, and MERGE."
        3: "Incorrect. Delta Lake has no enforced UNIQUE constraint. Uniqueness must be maintained at the application level (e.g., via MERGE with deduplication logic)."
        4: "Correct. PRIMARY KEY constraints can be declared but are informational only. The query optimizer can use them for join planning, but they will not prevent duplicate or null key values from being written."

  # ── 10. Liquid Clustering (new PDE topic) ───────────────────
  - type: "single_select"
    intro: "Databricks now recommends Liquid Clustering for all new Delta tables as the primary data layout strategy."
    prompt: "Which of the following statements about Liquid Clustering is correct?"
    choices:
      - { id: "1", text: "Liquid Clustering can be enabled on a table that already uses ZORDER" }
      - { id: "2", text: "You can redefine clustering keys on an existing liquid-clustered table without rewriting existing data" }
      - { id: "3", text: "Liquid Clustering requires explicitly choosing low-cardinality columns" }
      - { id: "4", text: "Liquid Clustering is compatible with Hive-style table partitioning" }
    correct_choice_ids: ["2"]
    tags: ["delta-lake", "liquid-clustering", "optimization"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/aws/en/delta/clustering"
    rationale:
      correct: "A key advantage of Liquid Clustering over partitioning and ZORDER is that you can change the clustering keys at any time using `ALTER TABLE … CLUSTER BY (new_col)` without triggering a full table rewrite. Existing data retains its current layout; only new data written after the change and data incrementally clustered by subsequent OPTIMIZE runs will use the new keys. This makes it practical to evolve your data layout as query patterns change."
      per_choice:
        1: "Incorrect. Liquid Clustering is *not compatible* with ZORDER or partitioning. If you want to migrate an existing partitioned or Z-ordered table to liquid clustering, you must drop the partition or ZORDER configuration first."
        2: "Correct. Clustering keys can be redefined with `ALTER TABLE … CLUSTER BY` without rewriting existing data — the layout evolves incrementally."
        3: "Incorrect. Unlike traditional partitioning (which must use low-cardinality columns to avoid too many tiny partitions), Liquid Clustering has no cardinality restriction. You choose keys purely based on query access patterns, even for high-cardinality columns like user IDs or timestamps."
        4: "Incorrect. Liquid Clustering is explicitly incompatible with Hive-style partitioning. The official documentation states you cannot combine them on the same table."

  # ── 11. Shallow vs Deep Clone ──────────────────────────────
  - type: "single_select"
    prompt: "A data engineer creates a shallow clone of a Delta table for testing. Which of the following is true about the shallow clone?"
    choices:
      - { id: "1", text: "The clone has its own independent copy of the data files" }
      - { id: "2", text: "Changes to the source table are automatically reflected in the clone" }
      - { id: "3", text: "Running VACUUM on the source table may cause the clone to become unreadable" }
      - { id: "4", text: "Running VACUUM on the shallow clone removes files from the source table" }
    correct_choice_ids: ["3"]
    tags: ["delta-lake", "clone"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta/clone.html"
    rationale:
      correct: "A shallow clone creates a new Delta table that references the *same underlying Parquet data files* as the source — it only copies the transaction log (metadata). Because the clone does not own those files, running VACUUM on the source table can delete data files that the clone still needs to read, rendering the clone unreadable or causing errors. A deep clone, by contrast, copies the actual data files into the clone's own storage location, making it fully independent."
      per_choice:
        1: "Incorrect. This describes a *deep* clone. A shallow clone only copies the transaction log and metadata, leaving data files in the source location."
        2: "Incorrect. A clone is a point-in-time snapshot. Changes to the source after the clone operation are not automatically reflected — the clone has its own independent transaction log going forward."
        3: "Correct. If VACUUM on the source removes files that the clone's transaction log still references, the clone will fail to read those files."
        4: "Incorrect. VACUUM on a shallow clone only removes unreferenced files within the clone's own metadata scope. It does not affect the source table's files."

  # ── 12. Row-Level Concurrency ──────────────────────────────
  - type: "single_select"
    intro: "Delta Lake supports row-level concurrency to reduce write conflicts for certain operations."
    prompt: "From which Databricks Runtime version is row-level concurrency for MERGE INTO supported WITHOUT requiring Photon?"
    choices:
      - { id: "1", text: "DBR 12.2 LTS" }
      - { id: "2", text: "DBR 13.3 LTS" }
      - { id: "3", text: "DBR 14.2" }
      - { id: "4", text: "DBR 14.3 LTS" }
    correct_choice_ids: ["4"]
    tags: ["delta-lake", "concurrency", "merge"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/aws/en/optimizations/isolation-level"
    rationale:
      correct: "Row-level concurrency was introduced in DBR 14.2 but initially required Photon to work for MERGE INTO. From DBR 14.3 LTS onward, Photon is no longer required — row-level concurrency for MERGE is available on all cluster types. Row-level concurrency allows two concurrent MERGE operations to succeed if they touch different rows, reducing conflicts that would otherwise require one writer to retry the entire operation."
      per_choice:
        1: "Incorrect. DBR 12.2 LTS predates row-level concurrency support entirely."
        2: "Incorrect. DBR 13.3 LTS does not include row-level concurrency for MERGE."
        3: "Incorrect. DBR 14.2 introduced row-level concurrency but required Photon for MERGE INTO."
        4: "Correct. DBR 14.3 LTS removed the Photon requirement, making row-level concurrency for MERGE INTO available on standard clusters."

