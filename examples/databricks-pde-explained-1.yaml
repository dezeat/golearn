  # ── 32. Databricks Asset Bundles ────────────────────────────
  - type: "single_select"
    prompt: "What is the primary purpose of Databricks Asset Bundles (DABs)?"
    choices:
      - { id: "1", text: "To package and deploy Databricks resources (notebooks, jobs, pipelines, clusters) as code using a YAML configuration file" }
      - { id: "2", text: "To bundle Python libraries and deploy them to cluster init scripts" }
      - { id: "3", text: "To create Unity Catalog data bundles that share multiple tables with external recipients" }
      - { id: "4", text: "To compress and archive Delta table data files for cold storage" }
    correct_choice_ids: ["1"]
    tags: ["devops", "asset-bundles", "ci-cd"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/dev-tools/bundles/index.html"
    rationale:
      correct: "Databricks Asset Bundles (DABs) implement infrastructure-as-code for Databricks. A bundle is defined in a `databricks.yml` configuration file that declares jobs, pipelines, notebooks, clusters, Unity Catalog objects, and other Databricks resources. You can deploy different environments (dev, staging, prod) from the same bundle by overriding parameters per target. DABs integrate with the Databricks CLI (`databricks bundle deploy`) and CI/CD systems, enabling GitOps workflows for Databricks workloads."
      per_choice:
        1: "Correct. DABs let you define, version, and deploy the full set of Databricks resources as code via YAML configuration."
        2: "Incorrect. Python library deployment to clusters is handled separately via cluster libraries, init scripts, or environment configurations — not by DABs (though DABs can reference these configurations)."
        3: "Incorrect. Delta Sharing handles data sharing with external recipients. DABs are about resource deployment, not data sharing."
        4: "Incorrect. Delta table data lifecycle management (VACUUM, archiving) is not related to DABs."

  # ── 33. Job API and dbutils.widgets ─────────────────────────
  - type: "single_select"
    prompt: "A notebook is scheduled as a Databricks Job and needs to receive a date parameter passed via the Jobs API. Which code correctly retrieves the parameter named 'run_date' in the notebook?"
    choices:
      - { id: "1", text: "run_date = spark.conf.get('run_date')" }
      - { id: "2", text: "import sys; run_date = sys.argv[1]" }
      - { id: "3", text: "dbutils.widgets.text('run_date', ''); run_date = dbutils.widgets.get('run_date')" }
      - { id: "4", text: "run_date = dbutils.jobs.taskValues.get('run_date')" }
    correct_choice_ids: ["3"]
    tags: ["devops", "jobs", "dbutils", "parameters"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/jobs/index.html"
    rationale:
      correct: "When passing parameters to a notebook via the Jobs API or the Job UI, the parameters are set as notebook widget values. In the notebook, you first declare the widget (`dbutils.widgets.text('run_date', '')` declares a text widget with a default empty string) and then retrieve its value with `dbutils.widgets.get('run_date')`. The Job's API passes the parameter as the widget's value at runtime."
      per_choice:
        1: "Incorrect. `spark.conf.get('run_date')` reads a Spark configuration key, not a notebook widget value. Job notebook parameters are not automatically set as Spark conf keys."
        2: "Incorrect. `sys.argv` is a Python module argument mechanism for standalone scripts. Databricks notebooks do not receive parameters via `sys.argv`."
        3: "Correct. `dbutils.widgets.text` declares the widget and `dbutils.widgets.get` retrieves its value, which is set by the Job runtime from the API parameter."
        4: "Incorrect. `dbutils.jobs.taskValues` is used for passing values *between tasks* in a multi-task job (task output values), not for passing external parameters into a notebook."

  # ── 34. Repos / Git Integration ─────────────────────────────
  - type: "single_select"
    prompt: "A data engineer has an updated notebook in a remote Git branch called 'feature/ingest-v2', but the branch does not appear in the Databricks Repos UI dropdown. What is the correct way to check out this branch?"
    choices:
      - { id: "1", text: "Delete the repo in Databricks and re-clone the repository" }
      - { id: "2", text: "Use the Repos UI to pull from the remote and then select the branch from the dropdown" }
      - { id: "3", text: "Create the branch locally in the Repos UI by cloning from 'main' with the branch name 'feature/ingest-v2'" }
      - { id: "4", text: "Use the Databricks CLI or REST API to force-sync the repo with the remote" }
    correct_choice_ids: ["2"]
    tags: ["devops", "git", "repos"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/repos/git-operations-with-repos.html"
    rationale:
      correct: "When a branch exists on the remote but is not visible in Databricks Repos, it means the local repository cache has not yet fetched the latest remote references. Using the Repos UI 'Pull' operation (or fetching from remote) updates the list of available branches. After the pull, the branch 'feature/ingest-v2' will appear in the branch selector and you can check it out."
      per_choice:
        1: "Incorrect. Deleting and re-cloning the entire repository is destructive and unnecessary. A simple pull/fetch is sufficient."
        2: "Correct. Pulling from the remote updates the local branch list, making the new branch visible and selectable."
        3: "Incorrect. Creating a new branch from 'main' with the same name would create an empty branch divergent from the remote's feature branch. It would not contain the engineer's changes."
        4: "Incorrect. The Databricks CLI can interact with repos, but for this specific scenario the correct action is a pull/fetch from the UI, which achieves the same result with less complexity."

  # ── 35. Multi-Task Job Dependencies ─────────────────────────
  - type: "single_select"
    prompt: "In a Databricks multi-task job, Task A feeds into Task B and Task C (which run in parallel). Task D depends on both Task B and Task C. Task B succeeds, but Task C fails. What is the final job run status?"
    choices:
      - { id: "1", text: "The job succeeds because at least one downstream task (B) succeeded" }
      - { id: "2", text: "Task D is skipped, and the overall job run is marked as Failed" }
      - { id: "3", text: "Task D runs using Task B's output only, and the job succeeds" }
      - { id: "4", text: "The job is marked as Partially Succeeded" }
    correct_choice_ids: ["2"]
    tags: ["devops", "jobs", "workflow"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/jobs/index.html"
    rationale:
      correct: "In Databricks multi-task jobs, a task only runs if all of its upstream dependencies have *succeeded*. Since Task D depends on both Task B and Task C, and Task C failed, Task D will be skipped (shown as 'Skipped' in the UI). Because Task C failed and Task D was skipped, the overall job run status is **Failed**. There is no 'Partially Succeeded' status — any failed or permanently skipped task causes the entire run to be marked as Failed."
      per_choice:
        1: "Incorrect. All upstream tasks must succeed for a downstream task to run. One success out of two dependencies is not sufficient."
        2: "Correct. Task D is skipped (upstream failure), and the job run is marked Failed because not all tasks completed successfully."
        3: "Incorrect. Databricks jobs do not run a task with partial upstream outputs. Task D requires all dependencies (B *and* C) to succeed."
        4: "Incorrect. Databricks does not have a 'Partially Succeeded' job run status. The run is either Succeeded, Failed, Canceled, or Timed Out."

