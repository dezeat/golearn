  # ── 19. Auto Loader File Notification Mode ──────────────────
  - type: "single_select"
    intro: "Auto Loader supports two modes for detecting new files in cloud storage."
    prompt: "A team ingests data into a bucket that receives millions of files per day. The directory listing mode is becoming a bottleneck. Which Auto Loader option should be configured to switch to event-driven file detection?"
    choices:
      - { id: "1", text: "cloudFiles.useNotifications = true" }
      - { id: "2", text: "cloudFiles.fileNotificationMode = 'enabled'" }
      - { id: "3", text: "cloudFiles.notificationMode = 'fileNotification'" }
      - { id: "4", text: "No change is needed — Auto Loader automatically selects file notification mode at scale" }
    correct_choice_ids: ["1"]
    tags: ["auto-loader", "file-notification"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/ingestion/auto-loader/file-notification-mode.html"
    rationale:
      correct: "Setting `cloudFiles.useNotifications = true` switches Auto Loader from directory listing mode (periodically listing the storage path to detect new files) to file notification mode. In file notification mode, Auto Loader sets up cloud messaging services (AWS SNS+SQS, Azure Event Grid+Queue, GCP Pub/Sub) to receive an event message the instant a new file is created in the source path. This eliminates repeated O(n) directory listings and scales efficiently to billions of files."
      per_choice:
        1: "Correct. `cloudFiles.useNotifications = true` is the correct option to enable file notification mode."
        2: "Incorrect. `cloudFiles.fileNotificationMode` is not a valid Auto Loader option."
        3: "Incorrect. `cloudFiles.notificationMode` is not a valid Auto Loader option."
        4: "Incorrect. Auto Loader defaults to directory listing mode regardless of scale. File notification mode must be explicitly enabled."

  # ── 20. Auto Loader rescued data column ─────────────────────
  - type: "single_select"
    prompt: "Auto Loader is configured with `cloudFiles.schemaEvolutionMode = 'rescue'`. A new JSON file arrives with a column not present in the current inferred schema. What happens?"
    choices:
      - { id: "1", text: "The stream fails with an UnknownFieldException" }
      - { id: "2", text: "The new column is added to the schema and future data uses the updated schema" }
      - { id: "3", text: "The entire record is dropped" }
      - { id: "4", text: "The unexpected column's value is captured in a JSON string column called _rescued_data" }
    correct_choice_ids: ["4"]
    tags: ["auto-loader", "schema-evolution", "rescued-data"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/ingestion/auto-loader/schema.html"
    rationale:
      correct: "In `rescue` mode, Auto Loader never fails and never evolves the schema when it encounters an unknown column. Instead, it appends the unexpected column's name and value as a key-value pair inside a special JSON string column called `_rescued_data`. All expected columns are parsed normally. The record is not dropped. This mode is useful when you want a single, stable schema for downstream consumers but still need visibility into schema deviations — you can inspect `_rescued_data` to detect and react to upstream schema changes on your own schedule."
      per_choice:
        1: "Incorrect. An `UnknownFieldException` and stream failure occurs in the default `addNewColumns` mode, not in `rescue` mode."
        2: "Incorrect. Adding the new column to the schema and restarting is the behavior of `addNewColumns` mode (the default), not `rescue` mode."
        3: "Incorrect. The entire record is never dropped due to an unknown column in `rescue` mode. Only records with actual data quality issues are dropped when `expect_or_drop` DLT expectations are used."
        4: "Correct. In `rescue` mode, unexpected column values are captured in `_rescued_data` as a JSON string, and the schema is never evolved."

