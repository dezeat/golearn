  # ── 36. Medallion Architecture ──────────────────────────────
  - type: "single_select"
    prompt: "In the medallion (multi-hop) architecture, what is the primary purpose of the Silver layer?"
    choices:
      - { id: "1", text: "Store raw, unprocessed data exactly as ingested" }
      - { id: "2", text: "Provide cleaned, conformed, and deduplicated data" }
      - { id: "3", text: "Serve aggregated business-level metrics and KPIs" }
      - { id: "4", text: "Archive historical data for compliance" }
    correct_choice_ids: ["2"]
    tags: ["medallion-architecture"]
    difficulty: easy
    source_ref: "https://docs.databricks.com/en/lakehouse/medallion.html"
    rationale:
      correct: "The Silver layer takes raw Bronze data and applies transformations that make it trustworthy and consistent: deduplication (removing duplicate events from the source), schema enforcement (casting types, rejecting or quarantining malformed records), null handling, and potentially joining with slowly-changing reference data. Silver is the 'enterprise view' — clean, granular, and reliable — serving as the single source of truth for downstream Gold transformations and for direct data science/analytics consumption."
      per_choice:
        1: "Incorrect. Storing raw unprocessed data is the role of Bronze, which preserves source fidelity for auditing and reprocessing."
        2: "Correct. Silver applies data quality rules, deduplication, schema conformance, and type casting."
        3: "Incorrect. Aggregated business metrics belong in Gold, optimized for BI and dashboards."
        4: "Incorrect. Compliance-related data retention is managed by Delta time travel and VACUUM configuration, not by a specific medallion layer."

  # ── 37. SCD Type 2 with DLT ─────────────────────────────────
  - type: "single_select"
    prompt: "Which DLT APPLY CHANGES INTO option implements a Slowly Changing Dimension Type 2 (SCD2) pattern — preserving history by keeping all previous row versions?"
    choices:
      - { id: "1", text: "APPLY AS INSERT WHEN" }
      - { id: "2", text: "STORED AS SCD TYPE 2" }
      - { id: "3", text: "APPLY HISTORY = TRUE" }
      - { id: "4", text: "SEQUENCE BY with a version column" }
    correct_choice_ids: ["2"]
    tags: ["dlt", "cdc", "scd", "data-modelling"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta-live-tables/cdc.html"
    rationale:
      correct: "`STORED AS SCD TYPE 2` is the explicit clause in the DLT `APPLY CHANGES INTO` statement that activates the SCD Type 2 behavior. With SCD2, when a source record changes, the existing target row is not updated in-place — instead, it is end-dated (a `__END_AT` timestamp column is set) and a new row with the new values is inserted with a null `__END_AT`. This preserves the full history of all row states. Without this clause, `APPLY CHANGES INTO` defaults to SCD Type 1 (upsert, overwriting history)."
      per_choice:
        1: "Incorrect. `APPLY AS INSERT WHEN` is a clause that lets you conditionally treat certain source rows as pure inserts (not updates), not for SCD2 history."
        2: "Correct. `STORED AS SCD TYPE 2` activates full SCD2 history preservation in `APPLY CHANGES INTO`."
        3: "Incorrect. `APPLY HISTORY = TRUE` is not a valid DLT clause."
        4: "Incorrect. `SEQUENCE BY` is a required clause that determines which version of a record is the most recent — it does not control whether history is preserved."

  # ── 38. Star Schema vs Data Vault ────────────────────────────
  - type: "single_select"
    prompt: "A Gold layer table needs to serve BI tool queries efficiently with the lowest possible query complexity for end users. Which data modelling approach is most appropriate?"
    choices:
      - { id: "1", text: "Data Vault (Hubs, Links, Satellites)" }
      - { id: "2", text: "Third Normal Form (3NF)" }
      - { id: "3", text: "Star Schema (fact table + dimension tables)" }
      - { id: "4", text: "Entity-Attribute-Value (EAV)" }
    correct_choice_ids: ["3"]
    tags: ["data-modelling", "gold-layer", "star-schema"]
    difficulty: medium
    source_ref: "https://docs.databricks.com/en/lakehouse/medallion.html"
    rationale:
      correct: "A Star Schema denormalizes data into a central fact table (containing measurable events/metrics) surrounded by dimension tables (containing descriptive attributes). This design minimizes the number of joins BI tools need to run, produces highly readable queries, and is optimized for columnar storage engines like Delta Lake. It is the dominant model for the Gold layer in the medallion architecture when the goal is efficient, user-friendly analytical queries."
      per_choice:
        1: "Incorrect. Data Vault is optimized for the Silver layer (historical tracking, source agnostic, highly normalized). It is difficult for BI tools to query directly due to its three-table structure (Hubs + Links + Satellites) requiring many joins."
        2: "Incorrect. 3NF eliminates data redundancy and is suited for OLTP transactional systems. It requires many joins for analytical queries and performs poorly on columnar analytical engines compared to star schemas."
        3: "Correct. Star Schema is the standard Gold layer modelling approach for BI consumption — denormalized, join-minimal, and optimized for columnar scan performance."
        4: "Incorrect. EAV (Entity-Attribute-Value) is a highly flexible but extremely query-inefficient pattern. It requires pivoting and complex SQL to retrieve a full row, making it unsuitable for BI consumption."