  # ── 30. DLT Event Log ───────────────────────────────────────
  - type: "single_select"
    prompt: "Where does Delta Live Tables (DLT) write its pipeline event log, and how can a data engineer query it?"
    choices:
      - { id: "1", text: "To an S3/ADLS path specified by the pipeline owner; queried via the Files API" }
      - { id: "2", text: "To a system Delta table `event_log()` accessible as a SQL table function within the pipeline's target schema" }
      - { id: "3", text: "To a Databricks-managed Delta table in the pipeline's storage location, queryable via the event_log() table-valued function or directly from the storage path" }
      - { id: "4", text: "To Databricks system tables under system.lakeflow.pipeline_events" }
    correct_choice_ids: ["3"]
    tags: ["dlt", "observability", "event-log"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/delta-live-tables/observability.html"
    rationale:
      correct: "DLT writes its event log as a Delta table to the pipeline's configured storage location (under `<storage_path>/system/events`). You can query it directly by reading from that path, or more conveniently via the `event_log()` table-valued function in SQL (e.g., `SELECT * FROM event_log('<pipeline_id>')`). The event log contains rows for each pipeline event — update start/stop, data quality metrics from expectations, dataset refresh counts, and error details. This is the primary observability surface for DLT pipelines."
      per_choice:
        1: "Incorrect. The event log is a Delta table, not raw files accessed via the Files API."
        2: "Incorrect. The event log exists outside the pipeline's target schema — it is in a separate `system/events` subfolder within the pipeline storage. The `event_log()` function takes a pipeline ID, not a schema name."
        3: "Correct. The DLT event log is a Delta table at `<pipeline_storage>/system/events`, queryable via direct read or the `event_log()` SQL table-valued function."
        4: "Incorrect. DLT event logs are not stored in the Unity Catalog system schema hierarchy. They reside in the pipeline-specific storage path."

  # ── 31. Databricks SQL Alerts ───────────────────────────────
  - type: "single_select"
    prompt: "A data engineer sets up a Databricks SQL Alert on a query that checks if the row count of a pipeline output table is below 1000. The alert is configured to send a notification 'Just Once'. What does this mean?"
    choices:
      - { id: "1", text: "A notification is sent only the first time the alert condition is ever triggered, even across multiple query runs" }
      - { id: "2", text: "A notification is sent once per alert trigger event — the alert must return to a non-triggering state before it will send another notification" }
      - { id: "3", text: "A notification is sent only once per day, regardless of how often the alert triggers" }
      - { id: "4", text: "A notification is sent on every query refresh as long as the condition is true" }
    correct_choice_ids: ["2"]
    tags: ["databricks-sql", "alerts", "monitoring"]
    difficulty: hard
    source_ref: "https://docs.databricks.com/en/sql/user/alerts/index.html"
    rationale:
      correct: "The 'Just Once' notification option means a notification is sent when the alert *first* transitions into the triggered state. If the alert remains triggered on subsequent query refreshes, no additional notifications are sent. Only when the alert condition stops being true (the alert 'recovers') and then triggers again will another notification be sent. This prevents notification storms when a condition persists for many consecutive query runs."
      per_choice:
        1: "Incorrect. 'Just Once' does not mean only once for the lifetime of the alert. It means once per trigger-recovery cycle."
        2: "Correct. 'Just Once' sends a notification on the initial trigger and does not resend until the alert recovers and triggers again."
        3: "Incorrect. 'Just Once' is not a rate limit per day. It is about trigger-recovery cycles."
        4: "Incorrect. Sending a notification on every refresh while triggered is the behavior of the 'Always' notification option, not 'Just Once'."

