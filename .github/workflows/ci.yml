name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Full history: the identity guard below walks every commit in the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Public repo: every commit's author and committer email must be a
      # GitHub noreply address. A personal address in history is a privacy
      # leak that only a coordinated history rewrite can undo (agent
      # instructions -> Secrets and privacy). Checks the PR's commits, or
      # HEAD on a push.
      - name: Commit identity guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            range="-1 HEAD"
          fi
          # shellcheck disable=SC2086
          bad="$(git log --format='%h %ae %ce' $range | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print; break } }')"
          if [ -n "$bad" ]; then
            echo "Commits with a non-noreply author or committer email:"
            echo "$bad"
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Format check
        run: test -z "$(gofmt -l .)" || { echo "Files need formatting:"; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Test
        run: go test ./... -v -count=1

      - name: Build
        run: go build -o ./bin/golearn ./cmd/golearn

      - name: Smoke test — import + export roundtrip
        run: |
          ./bin/golearn import packs/go-basics.yaml
          ./bin/golearn export go-basics --out /tmp/export-test.yaml
          ./bin/golearn import /tmp/export-test.yaml

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...
